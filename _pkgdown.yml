url: https://gillescolling.com/ggplot3d/
template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: yes
  includes:
    in_header: |
      <script>
      (function () {
        var D = String.fromCharCode(36);
        window.MathJax = {
          tex: {
            inlineMath: [[D, D], ["\\(", "\\)"]],
            displayMath: [[D + D, D + D], ["\\[", "\\]"]]
          },
          chtml: { linebreaks: { automatic: true, width: "90% container" } },
          svg: { linebreaks: { automatic: true, width: "90% container" } },
          options: { renderActions: { addMenu: [] } }
        };
      })();
      </script>
      <style>
      .navbar .dropdown-menu { max-height: calc(100vh - 5rem); }
      .navbar .dropdown-menu .dropdown-item,
      .navbar .dropdown-menu .dropdown-header { color: var(--bs-body-color); }
      @media (max-width: 991.98px) {
        .navbar-collapse { max-height: calc(100vh - 3.5rem); max-height: calc(100dvh - 3.5rem); overflow-y: auto; overscroll-behavior: contain; }
        .navbar .dropdown-menu { max-height: none; overflow: visible; }
      }
      :root, [data-bs-theme="light"] {
        --bs-link-color: #2E6F9E;
        --bs-link-color-rgb: 46, 111, 158;
        --bs-link-hover-color: #24577D;
        --bs-link-hover-color-rgb: 36, 87, 125;
      }
      [data-bs-theme="dark"] {
        --bs-link-color: #7FB2D9;
        --bs-link-color-rgb: 127, 178, 217;
        --bs-link-hover-color: #A6CCE8;
        --bs-link-hover-color-rgb: 166, 204, 232;
      }
      @media (max-width: 575.98px) {
        html body main pre.sourceCode,
        html body main .sourceCode pre,
        html body main pre.sourceCode code,
        html body main .sourceCode pre code {
          white-space: pre !important;
          word-break: normal !important;
          overflow-wrap: normal !important;
          hyphens: none !important;
        }
        html body main pre.sourceCode,
        html body main .sourceCode pre { overflow-x: auto !important; }
      }
      .docs-animation { display: block; margin: 0 0 1rem; border: 1px solid #DFD7CA; border-radius: 0.375rem; background: #F5F6F8; overflow: hidden; }
      .docs-animation-dark { border-color: #495057; background: #343739; }
      .docs-animation > img, .docs-animation > video { display: block; margin: 0 auto; border: 0; border-radius: 0; }
      .docs-animation-dark { display: none !important; }
      [data-bs-theme="dark"] .docs-animation-light { display: none !important; }
      [data-bs-theme="dark"] .docs-animation-dark { display: block !important; }
      math[display="block"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
      </style>
figures:
  dev: svglite::svglite
  fig.ext: svg
  bg: '#F5F6F8'
  fig.width: 6.5
  fig.height: 4.5
  fig.asp: ~
home:
  title: 'ggplot3d: Three-Dimensional Plots with ggplot2'
