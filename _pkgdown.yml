- title: Statistical computations
  contents:
  - stat_surface_3d
  - stat_count_3d
  - stat_function_3d
  - stat_smooth_3d
  - stat_density_2d_3d
  - stat_ridgeline_3d
  - stat_isosurface_3d
  - stat_isofunction_3d
  - stat_density_3d
  - stat_hull_3d
  - probs
- title: Positions
  contents: [position_nudge_3d, position_stack_3d]
- title: Guides and themes
  contents: [guide_axis_3d]
- title: Output backends
  contents: [backend_3d]
